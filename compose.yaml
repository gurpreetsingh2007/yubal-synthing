# Yubal and Syncthing share the same music library directory. In Coolify, route
# the Yubal domain to port 8000 and (optionally) a separate Syncthing domain to
# port 8384; Syncthing's GUI remains its device-management interface.
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./syncthing-config:/config
      - /yubalData:/data
    ports:
      - "100.127.249.145:22000:22000/tcp"
      - "100.127.249.145:22000:22000/udp"
      - "100.127.249.145:21027:21027/udp"
    healthcheck:
      test:
        [
          CMD-SHELL,
          "curl -fkLsS -m 2 http://127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  yubal:
    build: .
    image: yubal:custom
    container_name: yubal
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      YUBAL_SCHEDULER_ENABLED: "true"
      YUBAL_SCHEDULER_CRON: "0 */6 * * *"
      YUBAL_AUDIO_FORMAT: opus
      YUBAL_FETCH_LYRICS: "true"
      YUBAL_YTMUSIC_LYRICS_FALLBACK: "true"
      YUBAL_REPLAYGAIN: "true"
      YUBAL_DOWNLOAD_UGC: "true"
      YUBAL_DOWNLOAD_CONCURRENCY: "3"
      YUBAL_TZ: Europe/Rome
      YUBAL_JOB_TIMEOUT_SECONDS: "99999"
    volumes:
      - /yubalData:/app/data
      - ./yubalConfig:/app/config
    healthcheck:
      test:
        [
          CMD-SHELL,
          'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    volumes:
      - /yubalData:/music
      - ./navidrome-data:/data
    environment:
      ND_SCANSCHEDULE: 24h
      ND_LOGLEVEL: info
