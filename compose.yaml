services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./syncthing-config:/config
      - ./data:/data1
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fkLsS -m 2 http://127.0.0.1:8384/rest/noauth/health | grep -q OK || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  yubal:
    build: .
    image: yubal:local
    container_name: yubal
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      YUBAL_SCHEDULER_ENABLED: "true"
      YUBAL_SCHEDULER_CRON: "0 */6 * * *"
      YUBAL_AUDIO_FORMAT: opus
      YUBAL_DOWNLOAD_CONCURRENCY: "3"
      YUBAL_METADATA_CONCURRENCY: "3"
      YUBAL_TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
      - ./yubal-config:/app/config
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    profiles: [media-server]
    environment:
      ND_SCANSCHEDULE: 24h
      ND_LOGLEVEL: info
    volumes:
      - ./data:/music:ro
      - ./navidrome-data:/data
    ports:
      - "4533:4533"
